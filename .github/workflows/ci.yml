name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI databases only. `localhost` vs `127.0.0.1` keeps the e2e guard (separate server) satisfied.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --preset ts-jest --runInBand
      - run: npm run build
      - name: Migrations on an empty database
        run: npx prisma migrate deploy
      - name: No drift between migrations and schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Row Level Security on every public table
        run: npx ts-node scripts/check-rls.ts
      - name: End-to-end tests (real database)
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c "CREATE DATABASE ci_e2e"
          node scripts/with-test-db.mjs prisma migrate deploy
          npm run test:e2e
      - name: npm audit (production dependencies; reported, not blocking)
        run: npm audit --omit=dev || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx next build
      - name: npm audit (production dependencies; reported, not blocking)
        run: npm audit --omit=dev || true
